<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
<defs>
  <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#111419"/><stop offset="1" stop-color="#050607"/></linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#00D2FF" stop-opacity=".25"/><stop offset="1" stop-color="#00D2FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="redglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#B62B32" stop-opacity=".30"/><stop offset="1" stop-color="#B62B32" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/></pattern>
</defs>
<rect x="2" y="2" width="1196" height="356" rx="18" fill="#0B0D0F" stroke="#2A2D31" stroke-width="1" opacity="1"/>
<rect x="3" y="3" width="1194" height="354" fill="url(#grid)"/>

<!-- Glowing node aura -->
<ellipse cx="950" cy="120" rx="260" ry="160" fill="url(#glow)" filter="url(#blur)"/>
<ellipse cx="880" cy="180" rx="180" ry="120" fill="url(#redglow)" filter="url(#blur)"/>

<!-- Geometric agent graph network -->
<g stroke="#2A2D31" stroke-width="1.5" opacity="0.7">
  <line x1="720" y1="210" x2="810" y2="150"/>
