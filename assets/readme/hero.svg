  <line x1="860" y1="90" x2="980" y2="70"/>
  <line x1="900" y1="200" x2="980" y2="150"/>
  <line x1="980" y1="70" x2="980" y2="150"/>
  <line x1="980" y1="150" x2="1080" y2="120"/>
  <line x1="980" y1="150" x2="1040" y2="230"/>
  <line x1="900" y1="200" x2="960" y2="270"/>
  <line x1="780" y1="270" x2="900" y2="200"/>
  <line x1="1040" y1="230" x2="1110" y2="260"/>
</g>
<g stroke="#00D2FF" stroke-width="2" stroke-opacity="0.6">
  <line x1="810" y1="150" x2="980" y2="150"/>
  <line x1="860" y1="90" x2="980" y2="150"/>
  <line x1="980" y1="150" x2="1040" y2="230"/>
</g>

<!-- Nodes -->
<circle cx="720" cy="210" r="4" fill="#8E8A82"/>
<circle cx="810" cy="150" r="5" fill="#00D2FF"/>
<circle cx="860" cy="90" r="4.5" fill="#8E8A82"/>
<circle cx="900" cy="200" r="5" fill="#E9E5DC"/>
<circle cx="960" cy="270" r="4" fill="#8E8A82"/>
<circle cx="980" cy="70" r="5" fill="#38BDF8"/>
<circle cx="980" cy="150" r="9" fill="#B62B32" stroke="#E9E5DC" stroke-width="2"/>
<circle cx="1040" cy="230" r="6" fill="#00D2FF"/>
<circle cx="1080" cy="120" r="4.5" fill="#8E8A82"/>
<circle cx="1110" cy="260" r="4" fill="#8E8A82"/>
<circle cx="780" cy="270" r="3.5" fill="#524F49"/>

<!-- Terminal Command Prompt Accent -->
<rect x="760" y="275" width="220" height="32" rx="6" fill="#13161A" stroke="#2A2D31" stroke-width="1"/>
