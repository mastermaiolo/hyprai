<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".03" stroke-width="1"/></pattern>
</defs>
<rect x="2" y="2" width="1196" height="336" rx="16" fill="#0B0D0F" stroke="#2A2D31" stroke-width="1"/>
<rect x="3" y="3" width="1194" height="334" fill="url(#grid)"/>

<!-- Header -->
<text x="40" y="44" font-family="JetBrains Mono, monospace" font-size="12px" font-weight="600" fill="#00D2FF" letter-spacing="2">CONTROL SURFACE &amp; INTERACTIVE HOTKEYS</text>
<text x="1160" y="44" font-family="JetBrains Mono, monospace" font-size="12px" font-weight="600" fill="#8E8A82" text-anchor="end">ERGONOMICS &amp; WORKFLOW</text>
<line x1="40" y1="58" x2="1160" y2="58" stroke="#2A2D31" stroke-width="1"/>

<!-- Left Box: Global Triggers -->
<g transform="translate(40, 78)">
  <rect x="0" y="0" width="540" height="234" rx="10" fill="#13161A" stroke="#2A2D31" stroke-width="1"/>
  <rect x="0" y="0" width="4" height="234" fill="#00D2FF" rx="2"/>
  <text x="24" y="32" font-family="JetBrains Mono, monospace" font-size="11px" font-weight="600" fill="#00D2FF">01 / HYPRLAND INVOCATION TRIGGERS</text>
  
  <!-- Trigger 1 -->
  <g transform="translate(24, 52)">
    <rect x="0" y="0" width="120" height="32" rx="6" fill="#1C1F24" stroke="#2A2D31" stroke-width="1"/>
    <text x="60" y="21" font-family="JetBrains Mono, monospace" font-size="12px" font-weight="700" fill="#E9E5DC" text-anchor="middle">SUPER + I</text>
    <text x="140" y="20" font-family="Inter, sans-serif" font-size="13px" fill="#E9E5DC">Global Keybind <tspan fill="#8E8A82">(binds.lua / hyprland.conf)</tspan></text>
  </g>

  <!-- Trigger 2 -->
  <g transform="translate(24, 98)">
    <rect x="0" y="0" width="120" height="32" rx="6" fill="#1C1F24" stroke="#2A2D31" stroke-width="1"/>
    <text x="60" y="21" font-family="JetBrains Mono, monospace" font-size="12px" font-weight="700" fill="#00D2FF" text-anchor="middle">hyprai</text>
    <text x="140" y="20" font-family="Inter, sans-serif" font-size="13px" fill="#E9E5DC">CLI Command <tspan fill="#8E8A82">(from any terminal / script)</tspan></text>
  </g>

  <!-- Trigger 3 -->
  <g transform="translate(24, 144)">
    <rect x="0" y="0" width="140" height="32" rx="6" fill="#1C1F24" stroke="#2A2D31" stroke-width="1"/>
    <text x="70" y="21" font-family="JetBrains Mono, monospace" font-size="12px" font-weight="700" fill="#38BDF8" text-anchor="middle">hyprai --doctor</text>
    <text x="160" y="20" font-family="Inter, sans-serif" font-size="13px" fill="#E9E5DC">Full Diagnostics <tspan fill="#8E8A82">(evaluates all candidates &amp; theme)</tspan></text>
  </g>
  
  <text x="24" y="214" font-family="JetBrains Mono, monospace" font-size="10px" fill="#8E8A82">&gt; Instantly dispatched with zero startup latency</text>
</g>

<!-- Right Box: Menu Navigation & Keystrokes -->
<g transform="translate(620, 78)">
  <rect x="0" y="0" width="540" height="234" rx="10" fill="#13161A" stroke="#2A2D31" stroke-width="1"/>
  <rect x="0" y="0" width="4" height="234" fill="#B62B32" rx="2"/>
  <text x="24" y="32" font-family="JetBrains Mono, monospace" font-size="11px" font-weight="600" fill="#B62B32">02 / IN-MENU KEYBOARD ERGONOMICS</text>
  
  <g transform="translate(24, 52)">
    <rect x="0" y="0" width="80" height="28" rx="6" fill="#1C1F24" stroke="#2A2D31" stroke-width="1"/>
    <text x="40" y="18" font-family="JetBrains Mono, monospace" font-size="11px" font-weight="700" fill="#E9E5DC" text-anchor="middle">TYPE</text>
    <text x="96" y="18" font-family="Inter, sans-serif" font-size="13px" fill="#E9E5DC">Instant fuzzy search across names, subtext &amp; categories</text>
  </g>

  <g transform="translate(24, 92)">
    <rect x="0" y="0" width="80" height="28" rx="6" fill="#1C1F24" stroke="#2A2D31" stroke-width="1"/>
    <text x="40" y="18" font-family="JetBrains Mono, monospace" font-size="11px" font-weight="700" fill="#00D2FF" text-anchor="middle">ENTER</text>
    <text x="96" y="18" font-family="Inter, sans-serif" font-size="13px" fill="#E9E5DC">Execute candidate in dedicated Fish terminal / Wayland app</text>
  </g>

  <g transform="translate(24, 132)">
    <rect x="0" y="0" width="80" height="28" rx="6" fill="#1C1F24" stroke="#2A2D31" stroke-width="1"/>
    <text x="40" y="18" font-family="JetBrains Mono, monospace" font-size="11px" font-weight="700" fill="#8E8A82" text-anchor="middle">ESC</text>
    <text x="96" y="18" font-family="Inter, sans-serif" font-size="13px" fill="#E9E5DC">Immediate dismiss without side effects</text>
  </g>

  <g transform="translate(24, 172)">
    <rect x="0" y="0" width="80" height="28" rx="6" fill="#1C1F24" stroke="#2A2D31" stroke-width="1"/>
    <text x="40" y="18" font-family="JetBrains Mono, monospace" font-size="11px" font-weight="700" fill="#38BDF8" text-anchor="middle">BACK</text>
    <text x="96" y="18" font-family="Inter, sans-serif" font-size="13px" fill="#E9E5DC">Return seamlessly from Web Portals or Settings submenus</text>
  </g>
  
  <text x="24" y="214" font-family="JetBrains Mono, monospace" font-size="10px" fill="#8E8A82">&gt; Index-mapped navigation; IDs never printed on screen</text>
</g>
</svg>
