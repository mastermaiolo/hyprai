# ══════════════════════════════════════════════════════════════════════
# Hypr.AI · Ferramentas de IA locais (CLI e apps desktop)
# Formato: id | ícone | nome | subtexto | categoria | candidatos | svg | args
#
# categoria: "cli" (roda num terminal Kitty) ou "desktop" (app gráfico)
# candidatos: um ou mais binários/caminhos separados por ";", testados em
#   ordem — o primeiro que existir vence. Nome solto (ex: "claude") é
#   procurado no PATH (checado dentro do fish, não do bash — pega o mesmo
#   PATH que o config.fish do usuário monta, incluindo linuxbrew/nvm/pyenv,
#   que o Hyprland/systemd não herda sozinho); caminho absoluto ou
#   começando por "~" é testado com -x. O candidato encontrado também é o
#   comando usado pra abrir.
# svg: nome de um arquivo dentro de svg/ (opcional, PNG também funciona) —
#   cai no emoji se vazio ou o arquivo não existir.
# args: argumento(s) fixos anexados ao comando na hora de abrir (opcional)
#   — útil quando o mesmo binário serve o CLI e a GUI por subcomando, ex.:
#   "hermes chat" (cli) e "hermes desktop" (desktop) são o mesmo candidato
#   "hermes" com args diferentes.
#
# Só entra no menu quem for encontrado no sistema — não precisa remover
# a linha de quem você não tem instalado, ela só fica invisível. Um
# modelo (ex.: um dos pesos "Hermes" da Nous Research) não entra aqui:
# modelo não é um programa que se detecta, é conteúdo servido por um
# runner (Ollama, LM Studio, Jan...) — é o runner que vai na lista abaixo.
# Linhas iniciadas com '#' ou vazias são ignoradas.
# ══════════════════════════════════════════════════════════════════════

